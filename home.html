<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note &amp; Do — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Playfair+Display:ital,wght@1,700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="app-header">
        <div class="header-top">
          <div class="header-greet">
            <h1 id="greet-title"></h1>
            <p>Hoje é um ótimo dia para avançar em seus objetivos!</p>
          </div>
          <div class="avatar-wrap">
            <div class="avatar" id="avatar-btn">D<span class="avatar-dot"></span></div>
            <div class="avatar-menu" id="avatar-menu">
              <a href="perfil.html"><span id="ic-user"></span>Meu Perfil</a>
              <a href="notificacoes.html"><span id="ic-bell"></span>Notificações</a>
            </div>
          </div>
        </div>
        <label class="search-bar">
          <span id="ic-search"></span>
          <input type="text" id="search-input" placeholder="Caçando aquela tarefa escondida...">
        </label>
      </div>

      <div class="content">
        <p class="date-banner" id="date-banner"></p>
        <div class="section-header">O QUE TEM PARA HOJE?</div>
        <div class="task-list" id="task-list"></div>
      </div>

      <div class="toast" id="toast">
        <b>Prontinho!</b>
        <span>Tarefa adicionada à lista.</span>
      </div>

      <div class="filter-menu" id="filter-menu">
        <button data-filter="todas" class="active"><span id="f-ic-list"></span>Todas</button>
        <button data-filter="concluida"><span id="f-ic-check"></span>Concluídas</button>
        <button data-filter="pendente"><span id="f-ic-clock"></span>Pendentes</button>
        <button data-filter="atrasada"><span id="f-ic-cross"></span>Atrasados</button>
      </div>

      <div class="fab-row">
        <button class="fab" id="filter-btn"><span id="ic-folder"></span></button>
        <button class="fab fab-add" id="add-btn"><span id="ic-plus"></span></button>
      </div>

      <!-- Add task modal -->
      <div class="overlay" id="modal-overlay">
        <div class="modal-sheet">
          <div class="modal-title">ADICIONE SUA TAREFA</div>
          <div class="modal-body">
            <textarea class="task-textarea" id="task-input" placeholder="Anote antes que esqueça!"></textarea>
            <p class="field-error" id="text-error"></p>

            <div class="date-row" id="date-row">
              <span id="ic-calendar"></span>
              <span id="date-label">adicione a data</span>
            </div>
            <p class="field-error" id="date-error"></p>

            <div class="mini-cal" id="mini-cal">
              <div class="mini-cal-head">
                <button id="mc-prev"><span id="ic-chevleft"></span></button>
                <span id="mc-month-label"></span>
                <button id="mc-next"><span id="ic-chevright"></span></button>
              </div>
              <div class="mini-cal-grid" id="mc-grid"></div>
            </div>

            <div class="confirm-cancel" id="confirm-cancel">
              <p>Você realmente quer cancelar?</p>
              <div class="row">
                <button id="cc-no">Não</button>
                <button class="yes" id="cc-yes">Sim</button>
              </div>
            </div>

            <div class="modal-actions" id="modal-actions">
              <button class="btn-cancel" id="cancel-btn">CANCELAR</button>
              <button class="btn-confirm" id="confirm-btn">ADICIONAR</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  const state = loadNoteState();

  // ---- icons ----
  document.getElementById("ic-user").innerHTML = NICONS.user;
  document.getElementById("ic-bell").innerHTML = NICONS.bell;
  document.getElementById("ic-search").innerHTML = NICONS.search;
  document.getElementById("ic-folder").innerHTML = NICONS.folder;
  document.getElementById("ic-plus").innerHTML = NICONS.plus;
  document.getElementById("ic-calendar").innerHTML = NICONS.calendar;
  document.getElementById("ic-chevleft").innerHTML = NICONS.chevLeft;
  document.getElementById("ic-chevright").innerHTML = NICONS.chevRight;
  document.getElementById("f-ic-list").innerHTML = NICONS.list;
  document.getElementById("f-ic-check").innerHTML = NICONS.check;
  document.getElementById("f-ic-clock").innerHTML = NICONS.clock;
  document.getElementById("f-ic-cross").innerHTML = NICONS.cross;

  // ---- header ----
  document.getElementById("greet-title").textContent = `Seja Bem-Vinda, ${greetName(state)}!`;
  document.getElementById("avatar-btn").firstChild.textContent = state.user.name[0];

  const today = new Date();
  const dateFmt = today.toLocaleDateString("pt-BR", { day:"2-digit", month:"long" });
  document.getElementById("date-banner").textContent = `${dateFmt}: dia de conquistar suas metas!`;

  // ---- avatar dropdown ----
  const avatarBtn = document.getElementById("avatar-btn");
  const avatarMenu = document.getElementById("avatar-menu");
  avatarBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    avatarMenu.classList.toggle("open");
    filterMenu.classList.remove("open");
  });

  // ---- filter dropdown ----
  const filterMenu = document.getElementById("filter-menu");
  const filterBtn = document.getElementById("filter-btn");
  let activeFilter = "todas";
  filterBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle("open");
    avatarMenu.classList.remove("open");
  });
  filterMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if(!btn) return;
    activeFilter = btn.dataset.filter;
    filterMenu.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
    filterMenu.classList.remove("open");
    renderTasks();
  });

  document.addEventListener("click", () => {
    avatarMenu.classList.remove("open");
    filterMenu.classList.remove("open");
  });

  // ---- task rendering ----
  const taskListEl = document.getElementById("task-list");
  const searchInput = document.getElementById("search-input");

  function renderTasks(){
    const query = searchInput.value.trim().toLowerCase();
    let tasks = state.tasks.slice().sort((a,b) => a.date.localeCompare(b.date));

    if(activeFilter !== "todas"){
      tasks = tasks.filter(t => taskStatus(t) === activeFilter);
    }
    if(query){
      tasks = tasks.filter(t => t.title.toLowerCase().includes(query));
    }

    if(tasks.length === 0){
      taskListEl.innerHTML = `<div class="task-empty">Nenhuma tarefa por aqui. Que tal adicionar uma?</div>`;
      return;
    }

    taskListEl.innerHTML = tasks.map(t => {
      const status = taskStatus(t);
      const rowClass = status === "concluida" ? "done" : (status === "atrasada" ? "late" : "");
      return `
        <div class="task-row ${rowClass}" data-id="${t.id}">
          <button class="check" data-action="toggle">${NICONS.check}</button>
          <div class="task-info">
            <div class="task-title">${t.title}</div>
            <div class="task-date">${NICONS.calendar}<span>${formatDateBR(t.date)}</span></div>
          </div>
          <button class="task-del" data-action="delete">${NICONS.trash}</button>
        </div>`;
    }).join("");
  }

  taskListEl.addEventListener("click", (e) => {
    const actionBtn = e.target.closest("[data-action]");
    if(!actionBtn) return;
    const row = e.target.closest(".task-row");
    const id = row.dataset.id;
    const task = state.tasks.find(t => t.id === id);

    if(actionBtn.dataset.action === "toggle"){
      task.status = task.status === "concluida" ? "pendente" : "concluida";
      saveNoteState(state);
      renderTasks();
    } else if(actionBtn.dataset.action === "delete"){
      if(confirm(`Remover a tarefa "${task.title}"?`)){
        state.tasks = state.tasks.filter(t => t.id !== id);
        saveNoteState(state);
        renderTasks();
      }
    }
  });

  searchInput.addEventListener("input", renderTasks);
  renderTasks();

  // ---- add task modal ----
  const overlay = document.getElementById("modal-overlay");
  const addBtn = document.getElementById("add-btn");
  const taskInput = document.getElementById("task-input");
  const textError = document.getElementById("text-error");
  const dateRow = document.getElementById("date-row");
  const dateLabel = document.getElementById("date-label");
  const dateError = document.getElementById("date-error");
  const miniCal = document.getElementById("mini-cal");
  const confirmCancel = document.getElementById("confirm-cancel");
  const modalActions = document.getElementById("modal-actions");

  let selectedDate = null;
  let calYear = today.getFullYear();
  let calMonth = today.getMonth();

  function openModal(){
    overlay.classList.add("open");
    taskInput.value = "";
    selectedDate = null;
    dateLabel.textContent = "adicione a data";
    dateRow.classList.remove("has-date");
    textError.textContent = "";
    dateError.textContent = "";
    miniCal.classList.remove("open");
    confirmCancel.classList.remove("open");
    modalActions.style.display = "flex";
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    renderMiniCal();
  }
  function closeModal(){
    overlay.classList.remove("open");
  }

  addBtn.addEventListener("click", openModal);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeModal(); });

  dateRow.addEventListener("click", () => {
    miniCal.classList.toggle("open");
  });

  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const mcGrid = document.getElementById("mc-grid");
  const mcLabel = document.getElementById("mc-month-label");

  function renderMiniCal(){
    mcLabel.textContent = `${monthNames[calMonth]} ${calYear}`;
    mcGrid.innerHTML = "";
    ["D","S","T","Q","Q","S","S"].forEach(d => mcGrid.innerHTML += `<div class="mini-cal-dow">${d}</div>`);
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayIso = todayISO();

    for(let i=0;i<firstDay;i++) mcGrid.innerHTML += `<button class="mini-cal-day" disabled></button>`;
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      let cls = "mini-cal-day";
      if(iso === todayIso) cls += " today";
      if(iso === selectedDate) cls += " selected";
      mcGrid.innerHTML += `<button class="${cls}" data-iso="${iso}">${d}</button>`;
    }
  }
  document.getElementById("mc-prev").addEventListener("click", () => {
    calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; }
    renderMiniCal();
  });
  document.getElementById("mc-next").addEventListener("click", () => {
    calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; }
    renderMiniCal();
  });
  mcGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".mini-cal-day");
    if(!btn || btn.disabled) return;
    selectedDate = btn.dataset.iso;
    dateLabel.textContent = formatDateFull(selectedDate);
    dateRow.classList.add("has-date");
    dateError.textContent = "";
    miniCal.classList.remove("open");
    renderMiniCal();
  });

  // cancel flow
  document.getElementById("cancel-btn").addEventListener("click", () => {
    if(taskInput.value.trim() || selectedDate){
      confirmCancel.classList.add("open");
      modalActions.style.display = "none";
    } else {
      closeModal();
    }
  });
  document.getElementById("cc-no").addEventListener("click", () => {
    confirmCancel.classList.remove("open");
    modalActions.style.display = "flex";
  });
  document.getElementById("cc-yes").addEventListener("click", closeModal);

  // confirm / add
  const toast = document.getElementById("toast");
  document.getElementById("confirm-btn").addEventListener("click", () => {
    const text = taskInput.value.trim();
    let valid = true;
    if(!text){
      textError.textContent = "Ops, escreva algo sobre esta tarefa";
      valid = false;
    } else {
      textError.textContent = "";
    }
    if(!selectedDate){
      dateError.textContent = "Escolha uma data de conclusão para sua tarefa!";
      valid = false;
    } else {
      dateError.textContent = "";
    }
    if(!valid) return;

    state.tasks.push({
      id: "t" + Date.now(),
      title: text,
      date: selectedDate,
      status: "pendente"
    });
    saveNoteState(state);
    renderTasks();
    closeModal();

    toast.classList.add("open");
    setTimeout(() => toast.classList.remove("open"), 2200);
  });
</script>
</body>
</html>
