<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note &amp; Do — Notificações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Playfair+Display:ital,wght@1,700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="simple-header">
        <a class="back" href="home.html"><span id="ic-back"></span>Voltar</a>
        <h1>Notificações</h1>
      </div>
      <div class="content" style="padding-top:20px;" id="notif-list"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  const state = loadNoteState();
  document.getElementById("ic-back").innerHTML = NICONS.back;

  const list = document.getElementById("notif-list");
  if(state.notifications.length === 0){
    list.innerHTML = `<div class="task-empty">Você está em dia! Nenhuma notificação por aqui.</div>`;
  } else {
    state.notifications.forEach(n => {
      list.innerHTML += `<div class="notif-item"><time>${n.time}</time><p>${n.text}</p></div>`;
    });
  }
</script>
</body>
</html>
