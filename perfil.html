<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note &amp; Do — Meu Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Playfair+Display:ital,wght@1,700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="simple-header">
        <a class="back" href="home.html"><span id="ic-back"></span>Voltar</a>
        <h1>Meu Perfil</h1>
      </div>
      <div class="content" style="padding-top:20px;">
        <div class="profile-card">
          <div class="profile-avatar" id="p-avatar"></div>
          <div class="profile-name" id="p-name"></div>
          <div class="profile-meta" id="p-course"></div>

          <div class="profile-stats">
            <div class="stat"><b id="p-total">0</b><span>tarefas</span></div>
            <div class="stat"><b id="p-done">0</b><span>concluídas</span></div>
            <div class="stat"><b id="p-late">0</b><span>atrasadas</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  const state = loadNoteState();
  document.getElementById("ic-back").innerHTML = NICONS.back;
  document.getElementById("p-avatar").textContent = state.user.name[0];
  document.getElementById("p-name").textContent = state.user.fullName;
  document.getElementById("p-course").textContent = state.user.course;

  document.getElementById("p-total").textContent = state.tasks.length;
  document.getElementById("p-done").textContent = state.tasks.filter(t => t.status === "concluida").length;
  document.getElementById("p-late").textContent = state.tasks.filter(t => taskStatus(t) === "atrasada").length;
</script>
</body>
</html>
